<style>
:root { --bg: #fcfcfd; --ink: #1e293b; --muted: #64748b; --accent: #2980b9; --border: #e2e8f0; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 19px/1.78 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "PingFang SC", "Hiragino Sans GB", "Noto Serif CJK SC", serif; }
a { color: var(--accent); text-underline-offset: 3px; }
.topbar { border-bottom: 1px solid var(--border); background: #fff; font: 13px/1.5 system-ui, sans-serif; }
.topbar-inner { max-width: 760px; margin: auto; padding: 12px 24px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.publication-badge { color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
main { max-width: 760px; margin: auto; padding: 48px 24px 80px; }
.essay-header { margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
.essay-eyebrow { color: var(--accent); font: 12px/1.6 ui-monospace, monospace; text-transform: uppercase; letter-spacing: .08em; }
h1 { color: #0f172a; font-size: clamp(28px, 4.5vw, 40px); line-height: 1.2; margin: 16px 0; }
h2 { font-size: 26px; line-height: 1.3; margin: 2em 0 .7em; }
h3 { font-size: 21px; line-height: 1.4; margin: 1.5em 0 .6em; }
p { margin: 0 0 1.3em; }
.essay-byline, .colophon { color: var(--muted); font: 14px/1.6 system-ui, sans-serif; }
blockquote { border-left: 3px solid var(--accent); padding-left: 20px; margin: 1.6em 0; }
ul { padding-left: 1.4em; } li { margin: .5em 0; }
ul ul { margin: .35em 0; }
.table-scroll { overflow-x: auto; margin: 24px 0; }
table { width: 100%; border-collapse: collapse; font: 15px/1.6 system-ui, sans-serif; }
th, td { text-align: left; vertical-align: top; padding: 10px; border: 1px solid var(--border); }
th { background: #f0f9ff; }
code { font: 0.85em/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #f1f5f9; padding: 2px 5px; border-radius: 4px; color: #0f172a; }
.diagram-figure, .learning-figure { margin: 32px 0; color: #1e293b; }
.diagram-figure svg { display: block; width: 100%; height: auto; }
.diagram-figure figcaption, .learning-figure figcaption { font: 14px/1.6 system-ui, sans-serif; color: #475569; margin-top: 12px; }
.mermaid-scroll { overflow-x: auto; padding: .75rem; border: 1px solid #bae6fd; border-radius: 12px; background: #f8fafc; }
.mermaid-scroll:focus-visible { outline: 3px solid #0284c7; outline-offset: 3px; }
.mermaid-scroll img, .mermaid-scroll svg { display: block; width: 100%; height: auto; margin: 0 auto; }
.mermaid-framework img, .mermaid-framework svg { min-width: 420px; max-width: 560px; }
.mermaid-discovery img, .mermaid-discovery svg { max-width: 420px; }
.mermaid-mindmap img, .mermaid-mindmap svg { min-width: 700px; max-width: 960px; }
.mermaid-branch img, .mermaid-branch svg { min-width: 660px; max-width: 880px; }
.mermaid-tall img, .mermaid-tall svg { min-width: 480px; max-width: 580px; }
.mermaid-wide img, .mermaid-wide svg { min-width: 920px; max-width: 1120px; }
.source-record { margin: 24px 0; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: #f8fafc; }
.source-record summary { cursor: pointer; color: #0369a1; font: 15px/1.6 system-ui, sans-serif; }
.source-record pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.65 ui-monospace, monospace; }
:focus-visible { outline: 3px solid #0284c7; outline-offset: 4px; }
.colophon { margin-top: 48px; border-top: 1px solid var(--border); padding-top: 24px; }
@media(max-width: 480px) { main { padding: 32px 18px 60px; } body { font-size: 18px; } th, td { padding: 8px; font-size: 14px; } }
